name: test

# Runs the pytest suite on every branch push and PR (not on tag pushes — a
# v* tag goes straight to the release workflow, no extra check runs).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run tests
        run: python -m pytest -q --tb=short 2>&1 | tee pytest.txt
      # show the failing lines as ::error logs → GitHub converts them into
      # check-run annotations (the only failure detail readable anonymously)
      - name: Surface failures as annotations
        if: failure()
        shell: sh
        run: |
          tail -n 60 pytest.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
