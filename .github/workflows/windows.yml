name: windows-release

# Builds zfile-gui.exe on a Windows runner (GTK4 via MSYS2) and attaches it to
# the GitHub Release for a v* tag. workflow_dispatch builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-gcc

      # pip builds the C deps (brotli, pycryptodomex) with the mingw gcc above
      - name: Install package + PyInstaller
        run: |
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build zfile-gui.exe
        run: |
          python -m PyInstaller --noconfirm --clean --name zfile-gui run_gui.py
          APP=dist/zfile-gui/_internal

          # copy the GTK4 runtime (DLLs + resources) that the exe needs;
          # dlls go next to the exe's bundled files, resource data keeps the
          # same share/ and lib/ layout as the MSYS2 prefix
          mkdir -p "$APP/share" "$APP/lib"
          cp -r /mingw64/share/gtk-4.0 "$APP/share/"
          cp -r /mingw64/share/glib-2.0 "$APP/share/"
          cp -r /mingw64/lib/girepository-1.0 "$APP/lib/"
          cp -r /mingw64/lib/gdk-pixbuf-2.0 "$APP/lib/"
          cp /mingw64/bin/*.dll "$APP/"
          cp /mingw64/bin/gdbus.exe /mingw64/bin/gspawn-win64-helper.exe /mingw64/bin/gspawn-win64-helper-console.exe "$APP/" || true

      - name: Smoke-run
        run: ./dist/zfile-gui/zfile-gui.exe --help || true

      - name: Zip
        run: |
          cd dist
          7z a zfile-gui-windows-x64.zip zfile-gui

      - uses: actions/upload-artifact@v4
        with:
          name: zfile-gui-windows-x64
          path: dist/zfile-gui-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zfile-gui-windows-x64.zip
