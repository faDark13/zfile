[project]
name = "zfile"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "faDark13", email = "dark1234tan@gmail.com" }
]
# MSYS2's mingw Python is 3.14 — anything >= 3.12 is fine
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.1",
    "py7zr>=1.1.4",
    "typer>=0.27.3",
]

[project.scripts]
zfile = "zfile.cli:main"

# GUI script; on Windows this is packaged by the PyInstaller workflow into zfile-gui.exe
[project.gui-scripts]
zfile-gui = "zfile.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
# setuptools, not uv_build: MSYS2's mingw Python (cp314-...-gnu ABI) has no
# uv_build wheel, and building its Rust sdist needs a Rust toolchain.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
